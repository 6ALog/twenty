# Cloud Build config optimized for slow local connections.
#
# Submit with --no-source. Cloud Build clones the GitHub fork inside Google's
# network, then builds and pushes the Twenty image to Artifact Registry.

substitutions:
  _REGION: us-central1
  _ARTIFACT_REPOSITORY: twenty
  _IMAGE_NAME: twenty
  _DOCKER_TARGET: twenty
  _CHANNEL_TAG: dev
  _REPO_URL: https://github.com/6ALog/twenty.git
  _GIT_REF: gcp-artifact-pipeline

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: clone-source
    name: gcr.io/cloud-builders/git
    args:
      - clone
      - --depth=1
      - --branch=${_GIT_REF}
      - ${_REPO_URL}
      - .

  - id: build-twenty-image
    name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --file=packages/twenty-docker/twenty/Dockerfile
      - --target=${_DOCKER_TARGET}
      - --build-arg=APP_VERSION=${BUILD_ID}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:${BUILD_ID}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:${_CHANNEL_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:${_CHANNEL_TAG}
